name: "Verify fork Photos changes"

on:
    push:
        branches:
            - main
            - feat/ml-lab
            - feat/auto-unnamed-person
            - feat/integration-test
        paths:
            - ".github/actions/restore-rust-target/**"
            - ".github/actions/setup-flutter/**"
            - ".github/workflows/fork-photos-verify.yml"
            - "mobile/**"
            - "rust/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: fork-photos-verify-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        if: github.repository == 'a1c7e0/ente' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/ml-lab' || github.ref == 'refs/heads/feat/auto-unnamed-person' || github.ref == 'refs/heads/feat/integration-test')
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            CARGO_BUILD_JOBS: 2
            CARGO_INCREMENTAL: 0
            CARGO_PROFILE_DEV_DEBUG: 0
            CARGO_PROFILE_TEST_DEBUG: 0
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Setup Flutter
              uses: ./.github/actions/setup-flutter

            - name: Prepare Rust toolchain
              run: |
                  rustup update stable
                  rustup default stable

            - name: Restore Dart packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: photos-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
                  restore-keys: photos-pub-${{ runner.os }}-
                  path: |
                      ~/.pub-cache/hosted
                      ~/.pub-cache/git

            # Match the shared mobile-lint caches; tests restore but do not
            # replace the main-branch warm cache.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: rust-flutter
                  cache-targets: false
                  save-if: false

            - name: Restore Rust target
              uses: ./.github/actions/restore-rust-target
              with:
                  shared-key: rust-flutter

            - name: Resolve locked Photos dependencies
              working-directory: mobile/apps/photos
              run: flutter pub get --enforce-lockfile

            - name: Generate Flutter bindings
              working-directory: rust
              run: cargo codegen frb photos

            - name: Analyze and test Photos changes
              working-directory: mobile/apps/photos
              run: |
                  flutter analyze --no-pub
                  flutter test --no-pub test/models/ml/body_test.dart test/models/ml/body_file_data_test.dart test/models/ml/ml_metadata_update_test.dart test/ui/viewer/people/body_crop_test.dart test/ui/viewer/people/review_thumbnail_queue_test.dart test/ui/viewer/people/review_thumbnail_test.dart test/services/machine_learning/profile_review_test.dart test/db/ml_profile_review_test.dart

            - name: Verify face singleton review quality
              working-directory: rust
              run: cargo test --locked -p ente-photos --lib profile_review_keeps_quality_and_singleton_guards

            - name: Verify ML reset and synchronization
              working-directory: mobile/apps/photos
              run: flutter test --no-pub test/models/ml/face/person_cache_test.dart test/services/machine_learning/ml_photo_reset_service_test.dart test/services/machine_learning/metadata_sync_lock_test.dart

            - name: Verify automatic unnamed people
              if: hashFiles('mobile/apps/photos/test/services/machine_learning/auto_unnamed_person_service_test.dart') != ''
              working-directory: mobile/apps/photos
              run: flutter test --no-pub test/models/ml/face/person_test.dart test/services/machine_learning/auto_unnamed_person_service_test.dart test/services/machine_learning/auto_unnamed_deduplication_test.dart test/services/machine_learning/auto_unnamed_reconciliation_test.dart

            - name: Verify ML Lab diagnostics
              if: github.ref == 'refs/heads/feat/ml-lab' || github.ref == 'refs/heads/feat/integration-test'
              working-directory: mobile/apps/photos
              run: flutter test --no-pub test/ui/settings/debug test/services/machine_learning/body_association_test.dart test/ui/viewer/people/body_crop_cache_test.dart

            - name: Verify mobile model download selection
              if: github.ref == 'refs/heads/feat/ml-lab' || github.ref == 'refs/heads/feat/integration-test'
              working-directory: rust
              run: cargo test --locked -p ente-photos-frb --lib mobile_downloads_include_bodies_and_deduplicate_the_pet_detector
