name: "Build (Photos arm64 test APK)"

on:
    push:
        branches: [build/photos-arm64-test]
        paths: [".github/workflows/photos-build.yml"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: photos-arm64-test
    cancel-in-progress: false

jobs:
    build:
        if: github.repository == 'a1c7e0/ente'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            CARGO_BUILD_JOBS: 2
            CARGO_INCREMENTAL: 0
            SIGNING_KEY_PATH: ${{ runner.temp }}/photos-test.jks
            SIGNING_KEY_ALIAS: photos-test
            SIGNING_KEY_PASSWORD: android
            SIGNING_STORE_PASSWORD: android
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Setup JDK 17
              uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Flutter
              uses: ./.github/actions/setup-flutter

            - name: Prepare Android and Rust toolchains
              run: |
                  sudo rm -rf /usr/share/dotnet
                  rustup update stable
                  rustup default stable
                  rustup target add aarch64-linux-android
                  sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

            - name: Resolve locked Photos dependencies
              working-directory: mobile/apps/photos
              run: flutter pub get --enforce-lockfile

            - name: Generate Flutter bindings
              working-directory: rust
              run: cargo codegen frb photos

            - name: Prepare development signature and arm64 packaging
              run: |
                  keytool -genkeypair -keystore "$SIGNING_KEY_PATH" -storepass android -keypass android -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Ente Photos Test APK"
                  mkdir -p "$HOME/.gradle/init.d"
                  echo 'org.gradle.workers.max=2' >> "$HOME/.gradle/gradle.properties"
                  cat > "$HOME/.gradle/init.d/photos-arm64.gradle" <<'EOF'
                  allprojects { p ->
                      if (p.rootDir.canonicalPath != new File(System.getenv('GITHUB_WORKSPACE'), 'mobile/apps/photos/android').canonicalPath) return
                      p.afterEvaluate {
                          if (p.path == ':app') {
                              def android = p.extensions.findByName('android')
                              android.defaultConfig.ndk.abiFilters.clear()
                              android.buildTypes.each { it.ndk.abiFilters.clear() }
                          }
                      }
                  }
                  EOF

            - name: Build Photos arm64 release APK
              working-directory: mobile/apps/photos
              run: flutter build apk --no-pub --release --flavor dev --target-platform android-arm64 --split-per-abi --dart-define=cronetHttpNoPlay=true

            - name: Verify artifact
              env:
                  BUILT_SHA: ${{ github.sha }}
              run: |
                  mkdir artifacts
                  cp mobile/apps/photos/build/app/outputs/flutter-apk/app-dev-arm64-v8a-release.apk artifacts/ente-photos-arm64-test.apk
                  "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/ente-photos-arm64-test.apk
                  python3 - <<'PY'
                  import zipfile
                  with zipfile.ZipFile('artifacts/ente-photos-arm64-test.apk') as apk:
                      libraries = [p for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')]
                      assert {p.split('/')[1] for p in libraries} == {'arm64-v8a'}, libraries
                      assert 'lib/arm64-v8a/libente_photos_frb.so' in libraries
                      assert 'lib/arm64-v8a/libonnxruntime.so' in libraries
                  PY
                  printf '%s\n' "$BUILT_SHA" > artifacts/COMMIT
                  cd artifacts
                  sha256sum ente-photos-arm64-test.apk > SHA256SUMS

            - name: Upload APK
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ente-photos-arm64-test
                  path: artifacts/
                  if-no-files-found: error
                  retention-days: 7
