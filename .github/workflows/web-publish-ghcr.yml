name: "Publish GHCR (Web)"

on:
    push:
        branches: [main]
        paths:
            - '.dockerignore'
            - '.github/workflows/fork-publish-container.yml'
            - '.github/workflows/web-publish-ghcr.yml'
            - 'rust/**'
            - 'web/**'
    schedule:
        # Wednesdays at 07:00 UTC
        - cron: '0 7 * * 3'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        if: github.repository == 'ente/ente' && github.event_name != 'push'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Log in to GHCR
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

            - name: Build and push
              run: |
                  docker buildx create --use
                  docker buildx build --push \
                      --file web/Dockerfile \
                      --platform linux/amd64,linux/arm64 \
                      --tag ghcr.io/ente/web:${GITHUB_SHA} \
                      --tag ghcr.io/ente/web:latest \
                      .

    publish-fork:
        if: github.repository != 'ente/ente' && github.event_name != 'schedule'
        uses: ./.github/workflows/fork-publish-container.yml
        with:
            image: web
            context: .
            dockerfile: web/Dockerfile
            target: all
