name: "Build fork Photos APK"

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: fork-photos-apk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        if: github.repository == 'a1c7e0/ente' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/ml-lab' || github.ref == 'refs/heads/feat/face-profile-review' || github.ref == 'refs/heads/feat/integration-test')
        name: Build ${{ matrix.app }} arm64 APK
        strategy:
            fail-fast: false
            matrix:
                app: [photos]
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        env:
            APP: ${{ matrix.app }}
            APK_CHANNEL: ${{ github.ref == 'refs/heads/feat/integration-test' && 'integration' || github.ref == 'refs/heads/feat/ml-lab' && 'ml-lab' || github.ref == 'refs/heads/feat/face-profile-review' && 'face-profile-review' || 'main' }}
            ML_DIAGNOSTICS: ${{ github.ref == 'refs/heads/feat/ml-lab' || github.ref == 'refs/heads/feat/integration-test' }}
            CARGO_BUILD_JOBS: 2
            CARGO_INCREMENTAL: 0
            CARGO_PROFILE_DEV_DEBUG: 0
            CARGO_PROFILE_TEST_DEBUG: 0
            SIGNING_KEY_ALIAS: ${{ secrets.PHOTOS_TEST_KEY_ALIAS || 'ente-photos-test' }}
            SIGNING_KEY_PASSWORD: ${{ secrets.PHOTOS_TEST_KEY_PASSWORD || 'android' }}
            SIGNING_STORE_PASSWORD: ${{ secrets.PHOTOS_TEST_KEYSTORE_PASSWORD || 'android' }}
            SIGNING_KEYSTORE_BASE64: ${{ secrets.PHOTOS_TEST_KEYSTORE_BASE64 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Setup JDK 17
              uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: gradle
                  cache-dependency-path: |
                      mobile/apps/${{ matrix.app }}/android/**/*.gradle*
                      mobile/apps/${{ matrix.app }}/android/gradle/wrapper/gradle-wrapper.properties
                      mobile/gradle/**
                      mobile/pubspec.lock

            - name: Prepare persistent test signature and arm64 packaging
              run: |
                  export SIGNING_KEY_PATH="$RUNNER_TEMP/photos-test.jks"
                  printf 'SIGNING_KEY_PATH=%s\n' "$SIGNING_KEY_PATH" >> "$GITHUB_ENV"
                  if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
                      test -n "$SIGNING_KEY_ALIAS" || { echo 'Missing PHOTOS_TEST_KEY_ALIAS repository secret' >&2; exit 1; }
                      test -n "$SIGNING_KEY_PASSWORD" || { echo 'Missing PHOTOS_TEST_KEY_PASSWORD repository secret' >&2; exit 1; }
                      test -n "$SIGNING_STORE_PASSWORD" || { echo 'Missing PHOTOS_TEST_KEYSTORE_PASSWORD repository secret' >&2; exit 1; }
                      printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEY_PATH"
                      echo "Using the persistent Ente test signing key."
                  else
                      keytool -genkeypair -keystore "$SIGNING_KEY_PATH" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Ente Test APK"
                      echo "::warning::Persistent APK updates are disabled until PHOTOS_TEST_KEYSTORE_BASE64 and its related repository secrets are configured."
                  fi
                  chmod 600 "$SIGNING_KEY_PATH"
                  if ! keytool -list -keystore "$SIGNING_KEY_PATH" -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" > /dev/null; then
                      echo "::error::Signing keystore validation failed. Set PHOTOS_TEST_KEY_ALIAS to the alias stored in your keystore and check PHOTOS_TEST_KEYSTORE_PASSWORD."
                      exit 1
                  fi
                  mkdir -p "$HOME/.gradle/init.d"
                  echo 'org.gradle.workers.max=2' >> "$HOME/.gradle/gradle.properties"
                  cat > "$HOME/.gradle/init.d/photos-arm64.gradle" <<'EOF'
                  allprojects { p ->
                      if (p.rootDir.canonicalPath != new File(System.getenv('GITHUB_WORKSPACE'), "mobile/apps/${System.getenv('APP')}/android").canonicalPath) return
                      p.afterEvaluate {
                          if (p.path == ':app') {
                              def android = p.extensions.findByName('android')
                              android.defaultConfig.ndk.abiFilters.clear()
                              android.buildTypes.each { it.ndk.abiFilters.clear() }
                          }
                      }
                  }
                  EOF

            - name: Setup Flutter
              uses: ./.github/actions/setup-flutter

            - name: Prepare Android and Rust toolchains
              run: |
                  sudo rm -rf /usr/share/dotnet
                  rustup update stable
                  rustup default stable
                  rustup target add aarch64-linux-android
                  sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
                  test -n "$sdkmanager_path"
                  "$sdkmanager_path" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

            - name: Restore Dart packages
              id: dart-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: photos-pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
                  restore-keys: photos-pub-${{ runner.os }}-
                  path: |
                      ~/.pub-cache/hosted
                      ~/.pub-cache/git

            - name: Restore Rust dependencies
              id: cargo-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: photos-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
                  restore-keys: photos-cargo-v1-${{ runner.os }}-${{ runner.arch }}-
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git

            - name: Identify Rust build cache
              id: rust-build-key
              shell: bash
              env:
                  BUILD_INPUTS: ${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock', 'mobile/pubspec.lock', 'mobile/cargokit/**', format('mobile/apps/{0}/android/**/*.gradle*', matrix.app), 'mobile/gradle/**', '.github/actions/setup-flutter/action.yml') }}
              run: |
                  compiler="$(rustc -vV | sha256sum | cut -d ' ' -f 1)"
                  echo "prefix=${APP}-rust-v1-${APK_CHANNEL}-${ImageOS}-${ImageVersion}-${compiler}-${BUILD_INPUTS}" >> "$GITHUB_OUTPUT"
                  echo "compat-prefix=${APP}-rust-v1-${APK_CHANNEL}-${ImageOS}-${ImageVersion}-${compiler}" >> "$GITHUB_OUTPUT"

            - name: Restore Rust build outputs
              id: rust-build-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: ${{ steps.rust-build-key.outputs.prefix }}-${{ github.sha }}
                  restore-keys: |
                      ${{ steps.rust-build-key.outputs.prefix }}-
                      ${{ steps.rust-build-key.outputs.compat-prefix }}-
                  path: |
                      rust/target
                      mobile/apps/${{ matrix.app }}/build/ente_${{ matrix.app }}_frb/build

            # Reuse upstream's content-aware timestamp restoration so an unchanged
            # checkout does not invalidate Cargo's restored compilation artifacts.
            - name: Restore Rust source timestamps
              if: steps.rust-build-cache.outputs.cache-matched-key != ''
              run: node .github/actions/restore-rust-target/mtimes.mjs restore

            - name: Resolve locked dependencies
              working-directory: mobile/apps/${{ matrix.app }}
              run: flutter pub get --enforce-lockfile

            # Save before later tests/build/release steps can fail; the cache
            # action's implicit post-save only runs when the whole job succeeds.
            - name: Save Dart packages
              if: steps.dart-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: ${{ steps.dart-cache.outputs.cache-primary-key }}
                  path: |
                      ~/.pub-cache/hosted
                      ~/.pub-cache/git

            - name: Generate Flutter bindings
              working-directory: rust
              run: cargo codegen frb "$APP"

            - name: Save Rust dependencies
              if: steps.cargo-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git

            - name: Build ${{ matrix.app }} arm64 release APK
              working-directory: mobile/apps/${{ matrix.app }}
              run: flutter build apk --release --flavor dev --target-platform android-arm64 --split-per-abi --dart-define=cronetHttpNoPlay=true --dart-define=enteMLDiagnostics=$ML_DIAGNOSTICS --build-number=$((1000000 + GITHUB_RUN_NUMBER))

            - name: Collect APK
              env:
                  BUILT_SHA: ${{ github.sha }}
              run: |
                  mkdir artifacts
                  python3 - <<'PYTHON'
                  from pathlib import Path
                  import shutil
                  import os
                  app = os.environ['APP']
                  output = Path(f'mobile/apps/{app}/build/app/outputs/flutter-apk')
                  candidates = list(output.glob('app-*arm64-v8a*release.apk'))
                  assert len(candidates) == 1, list(output.glob('*.apk'))
                  print(f'Collecting {candidates[0]}')
                  shutil.copyfile(candidates[0], f"artifacts/ente-{app}-{os.environ['APK_CHANNEL']}-arm64.apk")
                  PYTHON
                  printf '%s\n' "$BUILT_SHA" > artifacts/COMMIT
                  cd artifacts
                  sha256sum "ente-${APP}-${APK_CHANNEL}-arm64.apk" > SHA256SUMS

            - name: Verify locked dependencies
              run: git diff --exit-code -- mobile/pubspec.lock

            - name: Verify artifact
              run: |
                  "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "artifacts/ente-${APP}-${APK_CHANNEL}-arm64.apk" > artifacts/SIGNATURE.txt
                  cat artifacts/SIGNATURE.txt
                  "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "artifacts/ente-${APP}-${APK_CHANNEL}-arm64.apk"
                  python3 - <<'PYTHON'
                  import zipfile
                  import os
                  app = os.environ['APP']
                  with zipfile.ZipFile(f"artifacts/ente-{app}-{os.environ['APK_CHANNEL']}-arm64.apk") as apk:
                      assert apk.testzip() is None, 'APK ZIP integrity check failed'
                      libraries = [p for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')]
                      print('Native libraries:', libraries)
                      assert {p.split('/')[1] for p in libraries} == {'arm64-v8a'}, libraries
                      assert f'lib/arm64-v8a/libente_{app}_frb.so' in libraries
                      assert 'lib/arm64-v8a/libonnxruntime.so' in libraries
                  PYTHON

            - name: Record Rust source timestamps
              if: steps.rust-build-cache.outputs.cache-hit != 'true'
              run: node .github/actions/restore-rust-target/mtimes.mjs save

            - name: Save Rust build outputs
              if: steps.rust-build-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
                  path: |
                      rust/target
                      mobile/apps/${{ matrix.app }}/build/ente_${{ matrix.app }}_frb/build

            - name: Upload APK
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ente-${{ matrix.app }}-${{ env.APK_CHANNEL }}-arm64
                  path: artifacts/
                  if-no-files-found: error
                  retention-days: 7

            - name: Publish test APK to Releases
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  tag="${APP}-${APK_CHANNEL}-test"
                  if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
                      signature_note="Consecutive builds on the same channel use the same test signing key, so they can update an existing installation."
                  else
                      signature_note="This build used an ephemeral signature; configure the fork test-signing secrets to update an existing installation."
                  fi
                  if [ "$APP" = photos ] && [ "$APK_CHANNEL" = integration ]; then
                      app_note="Photos integration uses the ML Lab application ID and can update that installation."
                  else
                      app_note="Install this APK alongside other Ente apps according to its configured application ID."
                  fi
                  notes="${APP} ${APK_CHANNEL} arm64 test candidate built from ${GITHUB_SHA}. ${signature_note} ${app_note} See architecture/fork-testing.md and architecture/integration-test-checklist.zh.md."
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true
                      gh release upload "$tag" artifacts/* --clobber
                      gh release edit "$tag" --notes "$notes"
                  else
                      gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --title "${APP} ${APK_CHANNEL} arm64 test APK" --notes "$notes" --prerelease --latest=false
                  fi
